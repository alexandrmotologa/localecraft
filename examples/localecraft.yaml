# localecraft configuration manifest
version: "1"
source_locale: "en"
target_locales:
  - "de"
  - "fr"
  - "es"
  - "ja"

files:
  - path: "locales/en.json"
    format: "json_nested"
    output_pattern: "locales/{{.Locale}}.json"

ui_constraints:
  font_defaults:
    family: "Inter"
    size_px: 14
    weight: 500
    letter_spacing_px: 0.0
    padding_x_px: 12
    line_height: 1.4

  keys:
    "nav.checkout_btn":
      max_width_px: 120
      max_lines: 1
      context: "Primary checkout CTA in top header bar."

    "settings.delete_account_confirm":
      max_width_px: 220
      max_lines: 1
      context: "Destructive confirmation button in account danger zone."

    "nav.save_btn":
      max_width_px: 100
      max_lines: 1
      context: "Toolbar save button."

    "dashboard.inbox_counter":
      format: "icu_messageformat"
      context: "Inbox task counter on header."

glossary:
  - term: "Workspace"
    translations:
      de: "Arbeitsbereich"
      fr: "Espace de travail"
      ja: "ワークスペース"

ai:
  provider: "heuristic" # "gemini", "openai", "heuristic"
